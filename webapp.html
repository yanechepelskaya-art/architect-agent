<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Agent</title>
    <style>
        body {
            margin: 0;
            background: #0b0e11;
            color: #eaeaea;
            font-family: -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #11161c;
            border: 1px solid #2b3139;
            border-radius: 18px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(212,175,55,0.05);
        }
        h1 {
            color: #d4af37;
            font-size: 22px;
            margin: 0 0 8px;
        }
        .sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1e242c;
        }
        .label { color: #aaa; }
        .value { color: #fff; font-weight: 600; }
        .gold { color: #d4af37; }
        .btn {
            display: block;
            background: #d4af37;
            color: #0b0e11;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏰 Architect Agent</h1>
        <div class="sub">Твой центр управления</div>
        <div class="row"><span class="label">₿ BTC</span><span class="value gold">$64 400</span></div>
        <div class="row"><span class="label">🥇 PAXG</span><span class="value gold">$4 390</span></div>
        <div class="row"><span class="label">Баланс</span><span class="value">$112</span></div>
        <div class="row"><span class="label">PnL</span><span class="value">+$2.0</span></div>
        <a class="btn" href="#">Обновить</a>
    </div>
</body>
</html>
